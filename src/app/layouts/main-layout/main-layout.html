<div class="flex min-h-screen bg-gray-100 text-[#2b2d2f]">
    <aside class="w-16 fixed flex flex-col items-center py-6 bg-white shadow-xl border-r border-gray-200 fixed sm:relative z-10">
        <nav class="flex-1 flex flex-col space-y-2">

            <div class="mt-2 mb-3">
                <img class="h-10 w-10 rounded object-cover mx-auto shadow-md" src="https://recetariopwa.sfo3.digitaloceanspaces.com/icon-512x512.png" alt="Recetario logo">
            </div>

            <hr class="my-2 border border-gray-100">

            <a routerLink="/" routerLinkActive="bg-[#a2aadb] text-white" [routerLinkActiveOptions]="{ exact: true }" class="mt-4 p-2 text-[#2b2d2f] hover:text-white rounded-xl hover:bg-[#a2aadb] transition duration-150 block relative group">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="28"  height="28" viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-home"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>

                <span class="absolute hidden group-hover:block left-full top-1/2 -translate-y-1/2 ml-4 whitespace-nowrap bg-[#8f96c1] text-white font-semibold text-xs rounded py-1 px-2 z-20">
                    Inicio
                </span>
            </a>
            
            <a routerLink="/recipes" routerLinkActive="bg-[#a2aadb] text-white" [routerLinkActiveOptions]="{ exact: true }" class="p-2 text-[#2b2d2f] hover:text-white rounded-xl hover:bg-[#a2aadb] transition duration-150 block relative group">
               <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg"  width="28"  height="28"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-chef-hat"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c1.918 0 3.52 1.35 3.91 3.151a4 4 0 0 1 2.09 7.723l0 7.126h-12v-7.126a4 4 0 1 1 2.092 -7.723a4 4 0 0 1 3.908 -3.151z" /><path d="M6.161 17.009l11.839 -.009" /></svg>

                <span class="absolute hidden group-hover:block left-full top-1/2 -translate-y-1/2 ml-4 whitespace-nowrap bg-[#8f96c1] text-white font-semibold text-xs rounded py-1 px-2 z-20">
                    Administrar recetas
                </span>
            </a>

            <a routerLink="role-requests" routerLinkActive="bg-[#a2aadb] text-white" [routerLinkActiveOptions]="{ exact: true }" class="p-2 text-[#2b2d2f] hover:text-white rounded-xl hover:bg-[#a2aadb] transition duration-150 block relative group">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg"  width="28"  height="28"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-user-question"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h3.5" /><path d="M19 22v.01" /><path d="M19 19a2.003 2.003 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483" /></svg>
                
                <span class="absolute hidden group-hover:block left-full top-1/2 -translate-y-1/2 ml-4 whitespace-nowrap bg-[#8f96c1] text-white font-semibold text-xs rounded py-1 px-2 z-20">
                     Solicitudes de rol
                </span>
            </a>

            <a routerLink="users" routerLinkActive="bg-[#a2aadb] text-white" [routerLinkActiveOptions]="{ exact: true }" class="p-2 text-[#2b2d2f] hover:text-white rounded-xl hover:bg-[#a2aadb] transition duration-150 block relative group">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg"  width="28"  height="28"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-users"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /><path d="M21 21v-2a4 4 0 0 0 -3 -3.85" /></svg>
                
                <span class="absolute hidden group-hover:block left-full top-1/2 -translate-y-1/2 ml-4 whitespace-nowrap bg-[#8f96c1] text-white font-semibold text-xs rounded py-1 px-2 z-20">
                    Administrar usuarios
                </span>
            </a>
            
        </nav>
    </aside>

    <div class="flex-1 flex flex-col">
        <header class="p-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 flex items-center space-x-1">
                        <ng-container [ngSwitch]="saludo">
                            <svg *ngSwitchCase="'Buenos días'"  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-sun"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg> 
                            <svg *ngSwitchCase="'Buenas tardes'" xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-sunset-2"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 13h1" /><path d="M20 13h1" /><path d="M5.6 6.6l.7 .7" /><path d="M18.4 6.6l-.7 .7" /><path d="M8 13a4 4 0 1 1 8 0" /><path d="M3 17h18" /><path d="M7 20h5" /><path d="M16 20h1" /><path d="M12 5v-1" /></svg>
                            <svg *ngSwitchCase="'Buenas noches'" xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-moon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" /></svg>
                        </ng-container> 
                        <span>{{ saludo }} Iceli</span>
                    </h1>
                    <p class="ml-7 mt-1 text-sm text-gray-500">{{ fechaHoy }}</p>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- NOTIFICATIONS -->
                    <div class="relative" #notificationsContainer>
                        <button (click)="toggleNotifications()" type="button" class="p-2 bg-[#a2aadb] rounded-full hover:bg-[#8f96c1] cursor-pointer" aria-expanded="true" aria-haspopup="true">
                            <svg xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="#fff"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-bell"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
                        </button>

                        <div *ngIf="isOpenNotifications()" class="origin-top-right absolute right-0 mt-2 w-72 rounded-md shadow-lg bg-white z-50" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
                            <div class="px-4 py-3 border-b border-gray-100">
                                <h4 class="text-sm font-semibold text-gray-800">Notificaciones (3)</h4>
                            </div>
                            <div class="py-1 max-h-80 overflow-y-auto">
                                <a href="role-requests" (click)="closeMenu()" class="block p-3 hover:bg-gray-50 border-b border-gray-100">
                                    <div class="flex items-start space-x-3">
                                        <div class="flex-shrink-0 mt-0.5 text-[#a2aadb]">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path><path d="M6 21v-2a4 4 0 0 1 4 -4h3.5"></path><path d="M19 22v.01"></path><path d="M19 19a2.003 2.003 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483"></path></svg>
                                        </div>
                                        <div>
                                            <p class="text-sm font-medium text-gray-800 leading-snug">
                                                Nueva solicitud de rol de <span class="font-bold">Iceli Juarez</span>.
                                            </p>
                                            <p class="text-xs text-gray-500 mt-0.5">hace 5 minutos</p>
                                        </div>
                                    </div>
                                </a>

                                <a href="recipes" (click)="closeMenu()" class="block p-3 hover:bg-gray-50 border-b border-gray-100">
                                    <div class="flex items-start space-x-3">
                                        <div class="flex-shrink-0 mt-0.5 text-gray-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-file-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path><path d="M12 11l0 6"></path><path d="M9 14l6 0"></path></svg>
                                        </div>
                                        <div>
                                            <p class="text-sm font-medium text-gray-800 leading-snug">
                                                Receta "Tarta de Limón" subida por <span class="font-bold">Chef Admin</span>.
                                            </p>
                                            <p class="text-xs text-gray-500 mt-0.5">hace 3 horas</p>
                                        </div>
                                    </div>
                                </a>
                            </div>

                            <div class="p-2 border-t border-gray-100">
                                <a routerLink="/all-notifications" (click)="closeMenu()" class="block text-sm font-medium text-center text-[#a2aadb] hover:text-[#8e99b7]">
                                    Ver todas las notificaciones
                                </a>
                            </div>
                        </div>
                    </div>


                    <!-- ICON MENU -->
                    <div class="relative inline-block text-left" #profileContainer>
                        <button (click)="toggleProfile()" type="button" class="flex items-center rounded-full" aria-expanded="true" aria-haspopup="true">
                            <img src="https://i.pinimg.com/736x/60/5a/66/605a6680015c6de804504e583ceb54ba.jpg" alt="Avatar" class="h-10 w-10 rounded-full object-cover border-2 border-[#a2aadb]">
                        </button>

                        <div *ngIf="isOpenProfile()" class="font-semibold origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white z-50" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
                            <div class="py-1" role="none">
                                <a routerLink="/user-profile" class="text-[#2b2d2f] flex items-center px-4 py-2 text-sm hover:bg-[#a2aadb] hover:text-white transition-colors" role="menuitem" tabindex="-1" id="menu-item-0" (click)="closeMenu()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                        <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path>
                                        <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>
                                    </svg>
                                    Mi Perfil
                                </a>
                                
                                <hr class="my-1 border-t border-gray-100">
                                
                                <a href="#" class="text-[#a53f3f] flex items-center px-4 py-2 text-sm hover:bg-[#F5CCCC] transition-colors" role="menuitem" tabindex="-1" id="menu-item-2" (click)="logout()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                        <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"></path>
                                        <path d="M7 12h14l-3 -3m0 6l3 -3"></path>
                                    </svg>
                                    Cerrar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div> 
        </header>
        
        <main class="px-8 pb-8 pt-2 flex-1">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
