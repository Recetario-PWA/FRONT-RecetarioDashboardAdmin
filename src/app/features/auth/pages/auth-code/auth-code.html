<div class="flex items-center justify-center min-h-screen bg-gray-100 text-[#2b2d2f]">
    <div class="relative flex flex-col m-6 space-y-8 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0">
        <div class="flex flex-col justify-center p-8 md:p-14">
            <span class="mb-3 text-4xl font-bold">Ingresa tu código</span>
            <span class="font-light text-gray-400 mb-8">Revisa tu correo electrónico y escribe el código de seguridad.</span>
            
            <form class="mt-3 mb-2 space-y-8" (submit)="onSubmit()">
                <div class="flex justify-center items-center gap-4"> 
                    <ng-container *ngFor="let digit of codeDigits; let i = index">
                        
                        <input 
                            #inputField 
                            type="text" 
                            maxlength="1" 
                            [value]="code[i]"
                            (input)="onInputChange(i, $event)"
                            (keydown.backspace)="onBackspace(i, $event)"
                            class="w-12 h-12 text-center text-2xl font-bold bg-[#f1f4f6] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a2aadb] focus:border-[#a2aadb] transition duration-150"
                            required
                        />
                        
                        <span *ngIf="i < codeDigits.length - 1" 
                              class="block w-2 h-2 rounded-full bg-[#a2aadb]">
                        </span>
                        
                    </ng-container>
                </div>

                <button type="submit" class="w-full font-bold bg-[#a2aadb] text-white p-2 rounded-lg hover:bg-[#8f96c1]">
                    Verificar
                </button>
            </form>
            
            <div class="mt-6 text-center text-[#2b2d2f]">
                ¿No recibiste ningún código?
                <a (click)="resendCode()" class="font-bold text-[#a2aadb] cursor-pointer">Solicitar nuevo código</a>
            </div>
        </div>
        <div class="relative">
            <img src="https://recetariopwa.sfo3.digitaloceanspaces.com/bassemsaad-saad-Me3xCGdlYl4-unsplash.jpg" alt="img" class="w-[400px] h-full hidden rounded-r-2xl md:block object-cover"/>
        </div>
    </div>
</div>
